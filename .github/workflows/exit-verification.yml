name: Exit verification

on:
  # Archived full inventory includes fixtures exceeding the current 72h study limit.
  # PRs use lastn-execution-integrity.yml; run this inventory only after bounding its fixtures.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exit-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the headless browser used by the functional test
        timeout-minutes: 10
        run: |
          # Hosted images may already supply Chrome. Exercise the same functional tests
          # with that executable instead of downloading another browser and apt bundle.
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "CTS_UI_BROWSER_EXECUTABLE=$(command -v "$browser")" >> "$GITHUB_ENV"
              "$browser" --version
              exit 0
            fi
          done
          npx playwright install --with-deps --only-shell chromium
      - run: npm run typecheck -- --pretty false
      - run: npm run lint
      - name: Build the production app and worker
        run: env -u DATABASE_URL npm run build
      - name: Run script, browser, app and component tests
        run: npm test -- --without-core

  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Each shard runs files serially. Two bounded compute workers use the hosted runner's cores.
      CTS_CORE_TEST_WORKERS: "2"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: env -u DATABASE_URL npm run build
      - name: Run the complete core inventory partition
        run: npm run test:core -- --test-shard=${{ matrix.shard }}/4

  slow-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: env -u DATABASE_URL npm run build
      - name: Run the two longer runtime checks
        run: npm run test:core:slow

  verify:
    runs-on: ubuntu-24.04
    if: always()
    needs: [quality, core-tests, slow-runtime]
    steps:
      - name: Require every verification partition
        env:
          QUALITY: ${{ needs.quality.result }}
          CORE: ${{ needs.core-tests.result }}
          SLOW: ${{ needs.slow-runtime.result }}
        run: test "$QUALITY" = success && test "$CORE" = success && test "$SLOW" = success
