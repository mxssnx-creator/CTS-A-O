name: Ordinary processing and hold comparison
on:
  pull_request:
    paths:
      - '.github/workflows/normal-progress-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        hold: [0, 15, 30, 60]
        offset: [0, 12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: env -u DATABASE_URL npm run build
      - run: node --experimental-strip-types --no-warnings scripts/prepare-normal-progress.mjs runs/normal-progress all ${{ matrix.hold }} ${{ matrix.offset }}
      - run: python3 scripts/run-normal-progress.py runs/normal-progress
        env:
          STUDY_HEAP_MB: '8192'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-hold${{ matrix.hold }}-offset${{ matrix.offset }}-${{ github.run_id }}
          path: runs/normal-progress/
          retention-days: 90
          compression-level: 3
