name: Stable-04 exploratory staged warmup
on:
  push:
    branches: [Stable-04]
    paths: [.github/workflows/stable04-staged-prehistory.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stable04-exploratory-staged-warmup-v1
  cancel-in-progress: true
jobs:
  staged-warmup:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      CTS_CORE_STATE: "off"
      CTS_CORE_AUTOSTART: "0"
      CTS_CORE_LIVE: "0"
      CTS_CORE_COMPARE: "0"
      CTS_CORE_VARIANTS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - run: npm ci
      - name: Verify frozen launch boundaries
        run: python3 scripts/run-stable04-replay.test.py
      - name: Build the offline worker
        run: npm run build:dev
      - name: Freeze the retrospective 48-hour continuous diagnostic
        run: |
          python3 scripts/prepare-stable04-replay-feed.py runs/stable04-staged-warmup
          node --experimental-strip-types --no-warnings scripts/prepare-stable04-replay.mjs runs/stable04-staged-warmup --focused --staged-warmup
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/scripts/lib/core-test-offline-guard.cjs
      - name: Run 24-hour warmup and 24-hour target as one continuous session
        run: python3 scripts/run-stable04-replay.py runs/stable04-staged-warmup --staged-warmup
      - name: Preserve completed or failed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable04-staged-warmup-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          compression-level: 3
          path: |
            runs/stable04-staged-warmup/feed-causal.json
            runs/stable04-staged-warmup/protocol.json
            runs/stable04-staged-warmup/settings.json
            runs/stable04-staged-warmup/wf.json
            runs/stable04-staged-warmup/command.json
            runs/stable04-staged-warmup/completion.json
            runs/stable04-staged-warmup/run.log
            runs/stable04-staged-warmup/memory.jsonl
            runs/stable04-staged-warmup/raw.json*
            runs/stable04-staged-warmup/session-*/**
            runs/stable04-staged-warmup/report/
