name: Last-N and demo execution integrity
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CTS_CORE_STATE: "off"
      CTS_CORE_AUTOSTART: "0"
      CTS_CORE_LIVE: "0"
      CTS_CORE_COMPARE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Bounded affected core tests, offline
        run: >-
          node scripts/test-core.mjs src/core/sim/processed-set.test.ts
          src/core/step-pf.test.ts src/core/server/demo-market.test.ts
          src/core/exchange/keys.test.ts
          src/core/server/last-n-samples.test.ts src/core/server/strategy-coverage.test.ts
          src/core/base-config-counts.test.ts src/core/pipeline/base-cell-stats.test.ts
          src/core/pipeline/step-sl-pf.test.ts src/core/server/evaluation-history.test.ts
          src/core/server/range-pf-floors.test.ts
      - name: Block attribution, recovery and explicit pre-calculation windows
        run: >-
          node scripts/test-core.mjs
          src/core/sim/block-attribution-regression.test.ts src/core/sim/block-recovery.test.ts
          src/core/sim/block-replay.test.ts src/core/server/three-day-prehistory.test.ts
          src/core/sim/continuous-validation.test.ts src/core/sim/gating.test.ts
      - name: Active-parent identity and partial-fill restart persistence
        run: >-
          node scripts/test-core.mjs
          src/core/server/live-parent-isolation.test.ts
          src/core/server/native-partial-weighted.test.ts
          src/core/server/processed-stage-adapter.test.ts
          src/core/server/processed-stage-durability.test.ts
      - name: Transport and rendered coverage component
        run: node --test scripts/core-live-report.test.mjs scripts/strategy-coverage-ui.test.mjs
      - run: npm run build
        env:
          DATABASE_URL: ""
      - name: Locate the isolated UI verification browser
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "CTS_UI_BROWSER_EXECUTABLE=$(command -v "$browser")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          npx playwright install --with-deps chromium
      - name: Render dev and production output without account access
        timeout-minutes: 5
        env:
          DATABASE_URL: ""
          CTS_CORE_MARKET: "synthetic"
          CTS_CORE_WORKERS: "1"
          CTS_CORE_VARIANTS: "0"
          CTS_CORE_TEST_SETTINGS: '{"symbols":2,"historyDays":3,"tfDays":{"1":3,"5":3,"15":3,"30":3}}'
          NODE_OPTIONS: --require ./scripts/lib/core-test-offline-guard.cjs
        run: |
          sudo mkdir -p /workspace/screenshots
          sudo chown "$(id -u):$(id -g)" /workspace/screenshots
          mkdir -p runs/parent-integrity-ui
          npm run dev -- --strictPort > runs/parent-integrity-ui/dev.log 2>&1 &
          dev_pid=$!
          npm run preview -- --host 127.0.0.1 --port 8081 --strictPort > runs/parent-integrity-ui/production.log 2>&1 &
          preview_pid=$!
          trap 'kill "$dev_pid" "$preview_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          for (const port of [8080,8081]) {
            const deadline = Date.now()+90000;
            while (true) {
              try {
                const response=await fetch(`http://127.0.0.1:${port}/`,{signal:AbortSignal.timeout(5000)});
                await response.arrayBuffer();
                if(response.ok)break;
              } catch {}
              if(Date.now()>deadline)throw Error(`Own UI listener ${port} did not become ready`);
              await new Promise(resolve=>setTimeout(resolve,500));
            }
          }
          NODE
          node scripts/browser-smoke.mjs http://127.0.0.1:8080/ /workspace/screenshots/ao-parent-dev.png
          node scripts/browser-smoke.mjs http://127.0.0.1:8081/ /workspace/screenshots/ao-parent-production.png --baseline /workspace/screenshots/ao-parent-dev.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parent-integrity-ui
          path: |
            /workspace/screenshots/ao-parent-*
            runs/parent-integrity-ui
          if-no-files-found: ignore
          retention-days: 7
