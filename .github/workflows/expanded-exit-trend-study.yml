name: Expanded Exit causal direction study
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: [trend1--12, trend1-0, trend1-12, trend3--12, trend3-0, trend3-12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: env -u DATABASE_URL npm run build
      - run: node --experimental-strip-types --no-warnings scripts/prepare-expanded-exit-trend-study.mjs runs/expanded-exit-trend
      - run: python3 scripts/run-signals-native-case.py runs/expanded-exit-trend ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expanded-exit-trend-${{ matrix.scenario }}-${{ github.run_id }}
          path: |
            runs/expanded-exit-trend/plan.json
            runs/expanded-exit-trend/${{ matrix.scenario }}/
          retention-days: 90
          compression-level: 3
