name: Frozen account risk and entry study

on:
  pull_request:
    branches: [cts-ao/exact-signal-configs-20261017]
    paths:
      - scripts/run-risk-entry-study.mjs
      - .github/workflows/risk-entry-study.yml
      - docs/simulations/risk-entry-study-plan-20261017.md
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: risk-entry-study-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Public standard Ubuntu runners only: four CPU / 16 GB per research job, no paid larger runners.
env:
  CTS_CORE_STATE: 'off'
  CTS_CORE_AUTOSTART: '0'
  CTS_CORE_VARIANTS: '0'
  CTS_CORE_COMPARE: '0'
  CTS_CORE_WORKERS: '4'
  CTS_CORE_LIVE: '0'
  CTS_CORE_MEM_SOFT_MB: '2500'
  CTS_CORE_MEM_HARD_MB: '1200'
  MALLOC_ARENA_MAX: '2'
  MALLOC_MMAP_THRESHOLD_: '1048576'
  DATABASE_URL: ''
  TZ: UTC

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Standalone policy contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check launcher syntax and frozen economic source
        run: |
          node --check scripts/run-risk-entry-study.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { ECONOMIC_COMMIT, RISK_CASES, CANDIDATE, RISK_NODE_FLAGS, riskCase, riskDesk, assessRiskOutcome, readRiskSessionResult, readRiskReportResult } from './scripts/run-risk-entry-study.mjs';
          import { writeSessionDump } from './scripts/lib/session-dump.mjs';
          import { FEED_SHA256, SYMBOLS, assertEconomicSource, sessionArguments } from './scripts/run-exact-signal-study.mjs';
          const manifest = JSON.parse(fs.readFileSync('scripts/studies/baseline-2860c3f.json'));
          assertEconomicSource(process.cwd(), manifest, 'corrected');
          assert.equal(manifest.correctedEconomicCommit, ECONOMIC_COMMIT);
          assert.equal(manifest.files.length, 82);
          assert.equal(CANDIDATE, 'entry5-gross1');
          assert.equal(Object.keys(RISK_CASES).length, 4);
          const original = { settings: { live: { enabled: false, maxPositions: 100, maxPositionX: 0, maxExposureX: 0 }, grid: { micro: { tp: [.002, .003] } }, gates: { minPf: 1.1 } }, wf: { simH: 6, preH: 6, longH: 6, validLastN: 25, lastNMinPf: 1 } };
          for (const id of Object.keys(RISK_CASES)) {
            const spec = riskCase(id), desk = riskDesk(original, spec);
            assert.equal(spec.symbols.length, 22);
            assert.equal(Date.parse(spec.start) - Date.parse(spec.evaluationFrom), 6 * 3600000);
            assert.equal(Date.parse(spec.end) - Date.parse(spec.start), 24 * 3600000);
            assert.equal(desk.wf.simH, 24); assert.equal(desk.wf.recordValidation, true);
            assert.equal(desk.wf.validLastN, 25); assert.equal(desk.wf.lastN, spec.entryLastN);
            assert.deepEqual(desk.settings.grid, original.settings.grid); assert.deepEqual(desk.settings.gates, original.settings.gates);
            assert.equal(desk.settings.live.maxPositions, 100); assert.equal(desk.settings.live.maxPositionX, .75);
            assert.equal(desk.settings.live.maxExposureX, spec.gross);
            if (spec.entryLastN) assert.equal(desk.wf.lastNMinPf, 1.2);
            const argv = sessionArguments(spec, { feed: 'f', desk: 'd', protocol: 'p', evidence: 'e' });
            for (const flag of ['--dump-only', '--tape-trades', '--signal-progress', '--frozen-session']) assert.ok(argv.includes(flag));
          }
          assert.equal(original.wf.simH, 6); assert.equal(original.settings.live.maxExposureX, 0);
          const spec = riskCase(CANDIDATE), row = { state: 'measured', exactPf: 1.3, closes: 1200, symbols: 12, unitGp: 1.3, unitGl: 1 };
          const study = { id: CANDIDATE, feedSha256: FEED_SHA256, sourceSha256: 'source', protocolSha256: 'protocol' };
          const audit = { purpose: 'final', window: { hours: 24, startT: Date.parse(spec.start), endT: Date.parse(spec.end), symbols: SYMBOLS }, provenance: { study }, checksOk: true, checks: [{ ok: true }], total: row,
            cohorts: [{ key: 'Engine', ...row }, { key: 'Signals', closes: 0, state: 'empty' }], cells: [-1, 1].map(side => ({ cohort: 'Engine', side, ...row, closes: 600 })),
            hours: Array.from({ length: 24 }, (_, i) => ({ fullHour: true, combined: { sizedNetUsd: i < 16 ? 1 : -1 } })), account: { startingBalance: 10, closedNetUsd: 2, markedEndingEquity: 11, greenHours: 16 } };
          const data = { study, checksOk: true, total: { caps: { on: true, maxPositionX: .75, maxExposureX: 1 }, eqMin: 9, equityMaxDdPct: .1, feasible: true, marginOver: { minutes: 0 }, ruinT: null } };
          assert.equal(assessRiskOutcome(audit, data, spec).researchAccepted, true);
          for (const mutate of [x => x.total.eqMin = 0, x => x.total.marginOver.minutes = 1, x => x.total.feasible = false, x => x.total.equityMaxDdPct = .100001]) {
            const x = structuredClone(data); mutate(x); const result = assessRiskOutcome(audit, x, spec);
            assert.equal(result.status, 'complete'); assert.equal(result.researchAccepted, false);
          }
          const loss = structuredClone(audit); loss.cohorts[0].exactPf = .9;
          assert.equal(assessRiskOutcome(loss, data, spec).researchAccepted, false);
          const signalLoss = structuredClone(audit); signalLoss.cohorts[1] = { key: 'Signals', ...row, exactPf: .8 };
          assert.equal(assessRiskOutcome(signalLoss, data, spec).researchAccepted, false);
          assert.ok(RISK_NODE_FLAGS.includes('--max-old-space-size=8192'));
          assert.ok(!RISK_NODE_FLAGS.some(x => x.startsWith('NODE_OPTIONS=')));
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'cts-risk-sidecars-'));
          try {
            const file = path.join(dir, 'raw.json'), raw = { trades: [{ sym: 'BTCUSDT', unitR: .01, closeIndex: 0 }], openEnd: [{ sym: 'ETHUSDT' }], tapeTrades: [{ id: 't', trades: [[1, .01], [2, -.02]] }], validation: [{ t: 1, checks: [{ id: 'v', pass: true }] }] };
            await writeSessionDump(file, raw, { arrayFields: ['trades'], maxChunkBytes: 256 });
            const original = fs.readFileSync(file), header = JSON.parse(original), loaded = await readRiskSessionResult(file);
            assert.deepEqual(loaded.trades, raw.trades); assert.deepEqual(loaded.openEnd, raw.openEnd);
            assert.deepEqual(loaded.tapeTrades, []); assert.deepEqual(loaded.validation, []);
            assert.deepEqual(loaded.tapeTradesSidecar, header.tapeTradesSidecar);
            assert.deepEqual(loaded.validationSidecar, header.validationSidecar);
            assert.deepEqual(fs.readFileSync(file), original);
            for (const manifest of [header.tapeTradesSidecar, header.validationSidecar, header.arraySidecars.trades]) {
              const chunk = path.join(dir, manifest.chunks[0].path), saved = fs.readFileSync(chunk), corrupt = Buffer.from(saved);
              corrupt[0] ^= 1; fs.writeFileSync(chunk, corrupt);
              await assert.rejects(readRiskSessionResult(file), /SHA256\/bytes mismatch/);
              fs.writeFileSync(chunk, saved);
            }
            assert.deepEqual((await readRiskSessionResult(file)).trades, raw.trades);
            const reportFile = path.join(dir, 'data.json');
            await writeSessionDump(reportFile, { ...data, sizedOrders: [{ closeIndex: 0, unitNotional: 1 }], sizedOpenOrders: [{ openIndex: 0, unitNotional: 1 }] }, { arrayFields: ['sizedOrders', 'sizedOpenOrders'], maxChunkBytes: 256 });
            const reportHeader = JSON.parse(fs.readFileSync(reportFile)), report = await readRiskReportResult(reportFile);
            assert.deepEqual(report.sizedOrders, []); assert.deepEqual(report.sizedOpenOrders, []);
            const result = assessRiskOutcome(audit, report, spec);
            assert.equal(result.researchAccepted, true);
            assert.deepEqual(result.reportEvidence.arraySidecars, reportHeader.arraySidecars);
            for (const manifest of Object.values(reportHeader.arraySidecars)) {
              const chunk = path.join(dir, manifest.chunks[0].path), saved = fs.readFileSync(chunk), corrupt = Buffer.from(saved);
              corrupt[0] ^= 1; fs.writeFileSync(chunk, corrupt);
              await assert.rejects(readRiskReportResult(reportFile), /SHA256\/bytes mismatch/);
              fs.writeFileSync(chunk, saved);
            }
            const workflow = fs.readFileSync('.github/workflows/risk-entry-study.yml', 'utf8');
            assert.ok(workflow.includes('/evidence/**'), 'all relative sidecar chunks remain in artifacts');
            assert.ok(fs.readFileSync('scripts/run-risk-entry-study.mjs', 'utf8').includes('"--chunk-allocations"'));
          } finally { fs.rmSync(dir, { recursive: true, force: true }); }
          console.log('Risk policy, 24h saved-WF, feasibility, 8GiB heap, verified lossless sidecars and exact economic source: passed');
          NODE

  data:
    name: Acquire and verify identical public candles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check retained public feed availability
        id: feed-availability
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const response = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: 39075929197, per_page: 100 });
              const artifact = response.data.artifacts.find(x => x.name === 'risk-entry-study-feed' && !x.expired);
              core.setOutput('available', String(Boolean(artifact)));
              core.info(artifact ? `Reuse retained public feed artifact ${artifact.id}` : 'Retained feed is absent or expired; rebuild exact public archives');
            } catch (error) {
              if (![404, 410].includes(error.status)) throw error;
              core.setOutput('available', 'false');
              core.info('Prior public run is unavailable; rebuild exact public archives');
            }
      - name: Restore retained exact public feed
        id: restore-feed
        if: steps.feed-availability.outputs.available == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: risk-entry-study-feed
          path: runs/risk-entry-feed
          github-token: ${{ github.token }}
          run-id: 39075929197
      - name: Require available artifact download to succeed
        if: steps.feed-availability.outputs.available == 'true' && steps.restore-feed.outcome != 'success'
        run: |
          echo 'Available feed artifact failed to download; preserve failure without rebuilding over possible corruption.' >&2
          exit 1
      - name: Collect missing or expired public feed
        if: steps.feed-availability.outputs.available == 'false'
        run: |
          mkdir -p runs/risk-entry-feed/logs
          node scripts/build-public-eval-feed.mjs --out runs/risk-entry-feed --concurrency 4 2>&1 | tee runs/risk-entry-feed/logs/collector.log
      - name: Verify exact feed hash and all archive evidence
        run: |
          mkdir -p runs/risk-entry-feed/logs
          node scripts/run-risk-entry-study.mjs --verify-feed runs/risk-entry-feed/feed.json 2>&1 | tee runs/risk-entry-feed/logs/verification.log
      - name: Preserve public data and checksum evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-entry-study-feed
          path: runs/risk-entry-feed/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  research:
    name: Risk study ${{ matrix.case }}
    needs: [checks, data]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [control-entry0-gross7, entry5-gross7, entry5-gross1, entry15-gross1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: |
          mkdir -p runs/risk-entry-study-ci/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.case }}/logs
          npm ci --ignore-scripts 2>&1 | tee runs/risk-entry-study-ci/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.case }}/logs/install.log
      - uses: actions/download-artifact@v4
        with:
          name: risk-entry-study-feed
          path: runs/risk-entry-feed
      - name: Run prespecified 22-symbol 24-hour account-risk arm
        run: |
          node scripts/run-risk-entry-study.mjs --case '${{ matrix.case }}' --feed runs/risk-entry-feed/feed.json \
            --out runs/risk-entry-study-ci/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.case }} 2>&1 | tee runs/risk-entry-study-ci/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.case }}/logs/study.log
      - name: Preserve complete evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-entry-study-${{ matrix.case }}
          path: |
            runs/risk-entry-study-ci/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.case }}/evidence/**
            runs/risk-entry-study-ci/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.case }}/frozen/**
            runs/risk-entry-study-ci/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.case }}/launcher.json
            runs/risk-entry-study-ci/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.case }}/source-proof.json
            runs/risk-entry-study-ci/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.case }}/failure.json
            runs/risk-entry-study-ci/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.case }}/logs/**
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1
