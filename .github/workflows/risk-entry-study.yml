name: Frozen account risk and entry study

on:
  pull_request:
    branches: [cts-ao/exact-signal-configs-20261017]
    paths:
      - scripts/run-risk-entry-study.mjs
      - .github/workflows/risk-entry-study.yml
      - docs/simulations/risk-entry-study-plan-20261017.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: risk-entry-study-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Public standard Ubuntu runners only: four CPU / 16 GB per research job, no paid larger runners.
env:
  CTS_CORE_STATE: 'off'
  CTS_CORE_AUTOSTART: '0'
  CTS_CORE_VARIANTS: '0'
  CTS_CORE_COMPARE: '0'
  CTS_CORE_WORKERS: '4'
  CTS_CORE_LIVE: '0'
  CTS_CORE_MEM_SOFT_MB: '2500'
  CTS_CORE_MEM_HARD_MB: '1200'
  MALLOC_ARENA_MAX: '2'
  MALLOC_MMAP_THRESHOLD_: '1048576'
  DATABASE_URL: ''
  TZ: UTC

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Standalone policy contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check launcher syntax and frozen economic source
        run: |
          node --check scripts/run-risk-entry-study.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { ECONOMIC_COMMIT, RISK_CASES, CANDIDATE, riskCase, riskDesk, assessRiskOutcome } from './scripts/run-risk-entry-study.mjs';
          import { FEED_SHA256, SYMBOLS, assertEconomicSource, sessionArguments } from './scripts/run-exact-signal-study.mjs';
          const manifest = JSON.parse(fs.readFileSync('scripts/studies/baseline-2860c3f.json'));
          assertEconomicSource(process.cwd(), manifest, 'corrected');
          assert.equal(manifest.correctedEconomicCommit, ECONOMIC_COMMIT);
          assert.equal(manifest.files.length, 82);
          assert.equal(CANDIDATE, 'entry5-gross1');
          assert.equal(Object.keys(RISK_CASES).length, 4);
          const original = { settings: { live: { enabled: false, maxPositions: 100, maxPositionX: 0, maxExposureX: 0 }, grid: { micro: { tp: [.002, .003] } }, gates: { minPf: 1.1 } }, wf: { simH: 6, preH: 6, longH: 6, validLastN: 25, lastNMinPf: 1 } };
          for (const id of Object.keys(RISK_CASES)) {
            const spec = riskCase(id), desk = riskDesk(original, spec);
            assert.equal(spec.symbols.length, 22);
            assert.equal(Date.parse(spec.start) - Date.parse(spec.evaluationFrom), 6 * 3600000);
            assert.equal(Date.parse(spec.end) - Date.parse(spec.start), 24 * 3600000);
            assert.equal(desk.wf.simH, 24); assert.equal(desk.wf.recordValidation, true);
            assert.equal(desk.wf.validLastN, 25); assert.equal(desk.wf.lastN, spec.entryLastN);
            assert.deepEqual(desk.settings.grid, original.settings.grid); assert.deepEqual(desk.settings.gates, original.settings.gates);
            assert.equal(desk.settings.live.maxPositions, 100); assert.equal(desk.settings.live.maxPositionX, .75);
            assert.equal(desk.settings.live.maxExposureX, spec.gross);
            if (spec.entryLastN) assert.equal(desk.wf.lastNMinPf, 1.2);
            const argv = sessionArguments(spec, { feed: 'f', desk: 'd', protocol: 'p', evidence: 'e' });
            for (const flag of ['--dump-only', '--tape-trades', '--signal-progress', '--frozen-session']) assert.ok(argv.includes(flag));
          }
          assert.equal(original.wf.simH, 6); assert.equal(original.settings.live.maxExposureX, 0);
          const spec = riskCase(CANDIDATE), row = { state: 'measured', exactPf: 1.3, closes: 1200, symbols: 12, unitGp: 1.3, unitGl: 1 };
          const study = { id: CANDIDATE, feedSha256: FEED_SHA256, sourceSha256: 'source', protocolSha256: 'protocol' };
          const audit = { purpose: 'final', window: { hours: 24, startT: Date.parse(spec.start), endT: Date.parse(spec.end), symbols: SYMBOLS }, provenance: { study }, checksOk: true, checks: [{ ok: true }], total: row,
            cohorts: [{ key: 'Engine', ...row }, { key: 'Signals', closes: 0, state: 'empty' }], cells: [-1, 1].map(side => ({ cohort: 'Engine', side, ...row, closes: 600 })),
            hours: Array.from({ length: 24 }, (_, i) => ({ fullHour: true, combined: { sizedNetUsd: i < 16 ? 1 : -1 } })), account: { startingBalance: 10, closedNetUsd: 2, markedEndingEquity: 11, greenHours: 16 } };
          const data = { study, checksOk: true, total: { caps: { on: true, maxPositionX: .75, maxExposureX: 1 }, eqMin: 9, equityMaxDdPct: .1, feasible: true, marginOver: { minutes: 0 }, ruinT: null } };
          assert.equal(assessRiskOutcome(audit, data, spec).researchAccepted, true);
          for (const mutate of [x => x.total.eqMin = 0, x => x.total.marginOver.minutes = 1, x => x.total.feasible = false, x => x.total.equityMaxDdPct = .100001]) {
            const x = structuredClone(data); mutate(x); const result = assessRiskOutcome(audit, x, spec);
            assert.equal(result.status, 'complete'); assert.equal(result.researchAccepted, false);
          }
          const loss = structuredClone(audit); loss.cohorts[0].exactPf = .9;
          assert.equal(assessRiskOutcome(loss, data, spec).researchAccepted, false);
          const signalLoss = structuredClone(audit); signalLoss.cohorts[1] = { key: 'Signals', ...row, exactPf: .8 };
          assert.equal(assessRiskOutcome(signalLoss, data, spec).researchAccepted, false);
          console.log('Risk policy, 24h saved-WF override, feasibility failures and exact economic source: passed');
          NODE

  data:
    name: Rebuild and verify identical public candles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect the same frozen public archives
        run: |
          mkdir -p runs/risk-entry-feed/logs
          node scripts/build-public-eval-feed.mjs --out runs/risk-entry-feed --concurrency 4 2>&1 | tee runs/risk-entry-feed/logs/collector.log
          node scripts/run-risk-entry-study.mjs --verify-feed runs/risk-entry-feed/feed.json 2>&1 | tee runs/risk-entry-feed/logs/verification.log
      - name: Preserve public data and checksum evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-entry-study-feed
          path: runs/risk-entry-feed/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1

  research:
    name: Risk study ${{ matrix.case }}
    needs: [checks, data]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [control-entry0-gross7, entry5-gross7, entry5-gross1, entry15-gross1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: |
          mkdir -p runs/risk-entry-study-ci/${{ matrix.case }}/logs
          npm ci --ignore-scripts 2>&1 | tee runs/risk-entry-study-ci/${{ matrix.case }}/logs/install.log
      - uses: actions/download-artifact@v4
        with:
          name: risk-entry-study-feed
          path: runs/risk-entry-feed
      - name: Run prespecified 22-symbol 24-hour account-risk arm
        run: |
          node scripts/run-risk-entry-study.mjs --case '${{ matrix.case }}' --feed runs/risk-entry-feed/feed.json \
            --out runs/risk-entry-study-ci/${{ matrix.case }} 2>&1 | tee runs/risk-entry-study-ci/${{ matrix.case }}/logs/study.log
      - name: Preserve complete evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-entry-study-${{ matrix.case }}
          path: |
            runs/risk-entry-study-ci/${{ matrix.case }}/evidence/**
            runs/risk-entry-study-ci/${{ matrix.case }}/frozen/**
            runs/risk-entry-study-ci/${{ matrix.case }}/launcher.json
            runs/risk-entry-study-ci/${{ matrix.case }}/source-proof.json
            runs/risk-entry-study-ci/${{ matrix.case }}/failure.json
            runs/risk-entry-study-ci/${{ matrix.case }}/logs/**
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
