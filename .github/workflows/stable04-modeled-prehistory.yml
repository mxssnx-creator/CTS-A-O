name: Stable-04 isolated modeled warmup
on:
  push:
    branches: [Stable-04]
    paths: [.github/workflows/stable04-modeled-prehistory.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Preserve the earlier warmup run while testing the compact, cooperative replay.
  group: stable04-modeled-warmup-v2
  cancel-in-progress: true
jobs:
  modeled-warmup:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      CTS_CORE_STATE: "off"
      CTS_CORE_AUTOSTART: "0"
      CTS_CORE_LIVE: "0"
      CTS_CORE_COMPARE: "0"
      CTS_CORE_VARIANTS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - run: npm ci
      - name: Verify frozen launch boundaries
        run: |
          python3 scripts/run-stable04-replay.test.py
          node --experimental-strip-types --no-warnings --test scripts/processed-warmup-runtime.test.mjs
      - name: Build the offline worker
        run: npm run build:dev
      - name: Freeze the 24-hour modeled warmup and target
        run: |
          python3 scripts/prepare-stable04-replay-feed.py runs/stable04-modeled-warmup
          node --experimental-strip-types --no-warnings scripts/prepare-stable04-replay.mjs runs/stable04-modeled-warmup --focused --modeled-warmup
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/scripts/lib/core-test-offline-guard.cjs
      - name: Run modeled warmup followed by a flat 24-hour target account
        run: python3 scripts/run-stable04-replay.py runs/stable04-modeled-warmup --modeled-warmup
      - name: Preserve completed or failed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable04-modeled-warmup-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          compression-level: 3
          path: |
            runs/stable04-modeled-warmup/feed-causal.json
            runs/stable04-modeled-warmup/protocol.json
            runs/stable04-modeled-warmup/settings.json
            runs/stable04-modeled-warmup/wf.json
            runs/stable04-modeled-warmup/command.json
            runs/stable04-modeled-warmup/completion.json
            runs/stable04-modeled-warmup/run.log
            runs/stable04-modeled-warmup/memory.jsonl
            runs/stable04-modeled-warmup/raw.json*
            runs/stable04-modeled-warmup/session-*/**
            runs/stable04-modeled-warmup/report/
