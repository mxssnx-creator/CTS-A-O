name: Signal report preview
on:
  pull_request:
    paths:
      - .github/workflows/signal-report-preview.yml
      - docs/signals-own-grid-150h-20261024/report.html
      - scripts/render-signal-coverage.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signal-report-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use the installed browser or install the headless shell
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "CTS_UI_BROWSER_EXECUTABLE=$(command -v "$browser")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          npx playwright install --with-deps --only-shell chromium
      - name: Render the actual standalone report on desktop and mobile
        run: |
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /workspace/signal-report-preview
          python -m http.server 8765 --bind 127.0.0.1 --directory docs/signals-own-grid-150h-20261024 > /workspace/signal-report-preview/server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/report.html > /dev/null && break; sleep 1; done
          node scripts/browser-smoke.mjs http://127.0.0.1:8765/report.html /workspace/signal-report-preview/report.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-report-preview-${{ github.run_id }}
          path: /workspace/signal-report-preview/
          if-no-files-found: error
